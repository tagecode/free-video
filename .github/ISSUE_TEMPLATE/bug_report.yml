name: Bug 报告
description: 报告应用本身的缺陷（崩溃、界面错乱、功能失效）
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先确认：如果只是某条线路播不出来，请改用上面的「线路反馈」模板，那类问题需要的信息不一样。

  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 设置页「关于」中显示的版本号
      placeholder: '1.0.0'
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10 / 11
        - macOS（Intel）
        - macOS（Apple Silicon）
        - Linux
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: 系统版本
      placeholder: '例如 macOS 15.3 / Windows 11 23H2 / Ubuntu 24.04'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开应用
        2. 粘贴 https://v.qq.com/x/cover/xxx.html
        3. 点击「开始播放」
        4. ……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 有截图或录屏请直接拖进这个输入框
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: '位于系统日志目录：macOS ~/Library/Logs/Free Video/，Windows %APPDATA%\Free Video\logs\，Linux ~/.config/Free Video/logs/'
      render: shell

  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 已确认不是某条解析线路失效导致的问题
          required: true
        - label: 已搜索过现有 issue，没有重复
          required: true
