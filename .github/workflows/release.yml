name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 打包（${{ matrix.os }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, flag: --win }
          - { os: macos-latest, flag: --mac } # 按 mac.target 声明的 arch 产出 x64 + arm64 各一套
          - { os: ubuntu-latest, flag: --linux }
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 校验 tag 与 package.json 版本一致
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $pkg 不一致"
            exit 1
          fi

      - name: 缓存 Electron 与 electron-builder（Unix）
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - name: 缓存 Electron 与 electron-builder（Windows）
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.LOCALAPPDATA }}\electron\Cache
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - run: pnpm build

      # 三个平台各自只产出安装包，不碰 Release；由 publish job 统一上传，
      # 避免多个 job 同时创建同一个 Release 时互相打断。
      - run: pnpm exec electron-builder ${{ matrix.flag }} --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error
          retention-days: 7

  publish:
    name: 上传 Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          ls -lh dist
          # 这个 job 没有 checkout，gh 无法从工作目录推断仓库，必须显式指定
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $tag 已存在，覆盖其中的同名附件"
            gh release upload "$tag" dist/* --clobber --repo "$repo"
          else
            gh release create "$tag" dist/* --title "$tag" --generate-notes --repo "$repo"
          fi
