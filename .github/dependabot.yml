version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # typescript-eslint 8 加载时会拒绝 TS 7，lint 直接崩溃（typescript-eslint#10940）
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-plugin-react 7 仍在调用 ESLint 10 已移除的 context.getFilename()
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
    groups:
      electron:
        patterns:
          - electron
          - electron-vite
          - electron-builder
          - electron-updater
          - electron-log
          - electron-store
          - '@electron-toolkit/*'
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - '@types/react'
          - '@types/react-dom'
      radix:
        patterns:
          - '@radix-ui/*'
      tooling:
        dependency-type: development
        exclude-patterns:
          - electron
          - electron-vite
          - electron-builder
          - electron-updater
          - electron-log
          - electron-store
          - '@electron-toolkit/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    commit-message:
      prefix: chore
      include: scope
