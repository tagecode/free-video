version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      electron:
        patterns:
          - electron
          - electron-vite
          - electron-builder
          - electron-updater
          - electron-log
          - electron-store
          - '@electron-toolkit/*'
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
          - '@types/react'
          - '@types/react-dom'
      radix:
        patterns:
          - '@radix-ui/*'
      tooling:
        dependency-type: development
        exclude-patterns:
          - electron
          - electron-vite
          - electron-builder
          - electron-updater
          - electron-log
          - electron-store
          - '@electron-toolkit/*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    commit-message:
      prefix: chore
      include: scope
